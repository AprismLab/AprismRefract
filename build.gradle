// Quilt-Support Aprism Extension (.aep)
// Loader-support extension (loader key "Q") that lets Aprism Loader scan
// quilt-mods/ and load genuine Quilt mods.
//
// Since v26.0-Alpha.2 the extension is fully self-contained on this branch:
// it ships its OWN Quilt translation layer (QuiltEntrypointBridge + the
// net.fabricmc.api.* shims that Quilt mods use through Quilt's built-in
// Fabric compatibility layer) and registers a LoaderEntrypointHandler through
// the extraction seam. The Aprism core no longer carries Quilt-specific
// dispatch; it supplies only the seam (com.aprism.loader.loaderext) and the
// Aprism-native fallback. The loader-core and manifest jars are compileOnly:
// the handler needs their types (LoaderEntrypointHandler, LoadedModContainer,
// AprismContextImpl) at compile time, but Aprism provides them at load time.

plugins {
    id 'java'
    id 'com.aprism.packaging'
}

// Project-level repositories. Declared here because a machine-wide Gradle
// init script injects mavenLocal() into every project, which makes Gradle
// ignore the settings-level dependencyResolutionManagement repositories.
repositories {
    mavenLocal()
    mavenCentral()
}

group = 'com.aprism.refract'
version = 'v26.5-Alpha.9'

// The Aprism build this extension aligns with (compile-time API surface).
// Resolved dynamically from the Aprism workspace's gradle.properties so the
// branch stays in sync with whatever Aprism version is currently checked out
// (locally and in CI), instead of hardcoding a version that drifts whenever
// Aprism bumps.
def aprismProps = new Properties()
file('../Aprism/gradle.properties').withInputStream { aprismProps.load(it) }
def aprismAlignVersion = aprismProps.getProperty('aprismVersion').trim()
def aprismLibs = "../Aprism/aprism-api/build/libs"
def loaderCoreLibs = "../Aprism/aprism-loader-core/build/libs"
def manifestLibs = "../Aprism/aprism-manifest/build/libs"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // compileOnly: provided by the Aprism runtime at load time, so the
    // extension jar must not bundle any of these.
    compileOnly files("${aprismLibs}/aprism-api-${aprismAlignVersion}.jar")
    compileOnly files("${loaderCoreLibs}/aprism-loader-core-${aprismAlignVersion}.jar")
    compileOnly files("${manifestLibs}/aprism-manifest-${aprismAlignVersion}.jar")

    // Branch-local test suite: runs the real Aprism runtime against the
    // built .aep so this branch verifies its own extraction end to end
    // without requiring any change in the Aprism repository.
    testImplementation files("${aprismLibs}/aprism-api-${aprismAlignVersion}.jar")
    testImplementation files("${loaderCoreLibs}/aprism-loader-core-${aprismAlignVersion}.jar")
    testImplementation files("${manifestLibs}/aprism-manifest-${aprismAlignVersion}.jar")
    // loader-core runtime dependencies (Mixin bootstrap + gson)
    testImplementation 'net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7'
    testImplementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'org.assertj:assertj-core:3.27.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    manifest {
        attributes 'Implementation-Title': 'AprismRefract Quilt-Support',
                   'Implementation-Version': project.version
    }
}

test {
    useJUnitPlatform()
}

// The Aprism packaging plugin registers packageAep. We configure it to bundle
// this extension's jar and the aprism.extension.json manifest.
aprismPackaging {
    outputDir = 'build/aprism'
}

// MC-version-specific .aep variants (v26.5-Alpha.2).
// Quilt mirrors Fabric version support: MC 1.14+ only.
def quiltVariants = [
    [mcVersion: '26.1.2',   loaderRange: '[0.29.0,0.30.0)', mcLabel: '26.1.2'],
    [mcVersion: '1.21.10',  loaderRange: '[0.29.0,0.30.0)', mcLabel: '1.21.10'],
    [mcVersion: '1.21.4',   loaderRange: '[0.29.0,0.30.0)', mcLabel: '1.21.4'],
    [mcVersion: '1.20.6',   loaderRange: '[0.26.0,0.27.0)', mcLabel: '1.20.6'],
    [mcVersion: '1.20.1',   loaderRange: '[0.26.0,0.27.0)', mcLabel: '1.20.1'],
    [mcVersion: '1.16.5',   loaderRange: '[0.26.0,0.27.0)', mcLabel: '1.16.5'],
]

quiltVariants.eachWithIndex { variant, idx ->
    def genDir = file("build/generated/manifests/${variant.mcLabel}")
    def genManifest = file("${genDir}/aprism.extension.json")
    def aepName = "Quilt-Support-A[26.0,28.0)-Q${variant.loaderRange}-JE-${variant.mcLabel}.aep"

    tasks.register("packageAep${variant.mcLabel.replace('.', '_')}", com.aprism.packaging.PackageAepTask) {
        dependsOn jar
        inputJars = files(jar.archiveFile)
        manifestFile = genManifest
        outputFile = file("build/aprism/${aepName}")
    }
}

packageAep {
    dependsOn jar
    inputJars = files(jar.archiveFile)
    manifestFile = file('aprism.extension.json')
    outputFile = file("build/aprism/Quilt-Support-A[26.0,28.0)-Q[0.29.0,0.30.0)-JE-26.2.aep")
}

tasks.register('packageAllAeps') {
    dependsOn tasks.withType(com.aprism.packaging.PackageAepTask)
}

quiltVariants.each { variant ->
    def genDir = file("build/generated/manifests/${variant.mcLabel}")
    def genManifest = file("${genDir}/aprism.extension.json")
    def taskName = "packageAep${variant.mcLabel.replace('.', '_')}"
    tasks.named(taskName) {
        doFirst {
            genDir.mkdirs()
            genManifest.text = """{
  "extensionId": "quilt-support",
  "type": "loader-support",
  "aprismRange": "[26.0.0,28.0.0)",
  "loaderKey": "Q",
  "loaderRange": "${variant.loaderRange}",
  "mcEdit": "JE",
  "mcVersion": "${variant.mcVersion}",
  "entrypoint": "com.aprism.refract.quilt.QuiltSupportExtension",
  "provides": ["quilt-loader"],
  "depends": {}
}"""
        }
    }
}

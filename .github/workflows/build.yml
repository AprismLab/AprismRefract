name: Build

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout AprismRefract (subdirectory)
        uses: actions/checkout@v4
        with:
          path: AprismRefract

      - name: Checkout Aprism (sibling)
        uses: actions/checkout@v4
        with:
          repository: NDBlockConnect/Aprism
          path: Aprism

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Aprism API jar
        working-directory: Aprism
        run: ./gradlew :aprism-api:jar --console=plain

      - name: Build extension + package .aep
        working-directory: AprismRefract
        run: ./gradlew build packageAep --console=plain

      - name: Upload .aep artifact
        uses: actions/upload-artifact@v4
        with:
          name: aep-${{ github.sha }}
          path: AprismRefract/build/aprism/*.aep
